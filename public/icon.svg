<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="50%" stop-color="#9E0C24"/>
      <stop offset="100%" stop-color="#690918"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2"/>
      <stop offset="50%" stop-color="#D6B36A"/>
      <stop offset="100%" stop-color="#9C7729"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Rim -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>
  
  <!-- Geometric Light Ray Motif Behind Logo -->
  <path d="M256 70 L300 200 L256 180 L212 200 Z" fill="url(#goldGrad)" opacity="0.3"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.1" stroke-dasharray="8 8"/>

  <!-- Iconic Stylized Z with Light Shield Ray -->
  <g filter="url(#glow)">
    <path d="M150 160 L362 160 L200 352 L362 352" 
          stroke="url(#goldGrad)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Noor Ray Dot (The Radiance of Trust) -->
    <circle cx="362" cy="160" r="22" fill="#FFFFFF"/>
    <circle cx="150" cy="352" r="14" fill="url(#goldGrad)"/>
    
    <!-- Central Shield Chevron -->
    <path d="M236 230 L256 254 L276 230" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
</svg>
